<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuenta creada</title>
</head>
<body style="margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#1f2937">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
               style="max-width:600px;background:#ffffff;border-radius:12px">
          <tr>
            <td style="padding:32px">
              <h1 style="margin:0 0 16px;color:#0f4c81">Hola, {{name}}</h1>
              <p>Tu cuenta ha sido creada correctamente.</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="8"
                     style="margin:20px 0;background:#f8fafc;border-radius:8px">
                <tr><td><strong>Correo:</strong></td><td>{{email}}</td></tr>
                <tr><td><strong>Contraseña temporal:</strong></td><td>{{password}}</td></tr>
                <tr><td><strong>Rol:</strong></td><td>{{role}}</td></tr>
              </table>
              <p>Por seguridad, cambia la contraseña después de iniciar sesión.</p>
              <p style="margin-bottom:0;color:#64748b">Gestión de Usuarios</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
